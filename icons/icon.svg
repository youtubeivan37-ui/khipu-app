<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Contayni</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F5286"/>
      <stop offset="0.45" stop-color="#0F2A4E"/>
      <stop offset="1" stop-color="#06142A"/>
    </linearGradient>
    <radialGradient id="brilloOro" cx="0.82" cy="0.86" r="0.45">
      <stop offset="0" stop-color="#EBBB40" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#EBBB40" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brilloCielo" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#57C7F0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#57C7F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F8FC"/>
      <stop offset="0.5" stop-color="#CFDDEB"/>
      <stop offset="1" stop-color="#8FA6BF"/>
    </linearGradient>
    <linearGradient id="plata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#CFDDEB"/>
      <stop offset="1" stop-color="#8399B2"/>
    </linearGradient>
    <linearGradient id="celeste" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9F5FF"/>
      <stop offset="0.45" stop-color="#57C7F0"/>
      <stop offset="1" stop-color="#1F6FB2"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1BF"/>
      <stop offset="0.4" stop-color="#EBBB40"/>
      <stop offset="1" stop-color="#A86A14"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EBBB40"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <filter id="resplandor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Placa: azul marino con brillo celeste arriba y oro abajo -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#fondo)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#brilloCielo)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#brilloOro)"/>
  <rect x="22" y="22" width="468" height="468" rx="92" fill="none" stroke="url(#borde)" stroke-width="9"/>
  <!-- Arco: claridad -->
  <path d="M60 182 C 130 74, 340 40, 458 140" fill="none" stroke="#F4F8FC" stroke-width="15" stroke-linecap="round"/>
  <!-- Línea dorada: trayectoria de avance -->
  <path d="M146 232 L 334 104" stroke="url(#linea)" stroke-width="12" stroke-linecap="round" filter="url(#resplandor)"/>
  <circle cx="338" cy="101" r="17" fill="#FFE08A" stroke="#EBBB40" stroke-width="5"/>
  <!-- Tres pilares ascendentes: plata, celeste y oro -->
  <rect x="124" y="262" width="60" height="152" rx="30" fill="url(#plata)"/>
  <rect x="220" y="206" width="60" height="208" rx="30" fill="url(#celeste)"/>
  <rect x="316" y="146" width="60" height="268" rx="30" fill="url(#oro)"/>
  <!-- Brillos verticales -->
  <path d="M142 284 V 392" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  <path d="M238 228 V 392" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
  <path d="M334 168 V 392" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="7" stroke-linecap="round"/>
</svg>
